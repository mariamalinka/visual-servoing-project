   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="61.4376" y="28.883682" transform="rotate(-0 61.4376 28.883682)">Control thread</text>
   </g>
   <g id="text_2">
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(20.765873 43.132196)">2 ms loop; owns live physics</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(13.966842 51.419462)">MuJoCo 500 Hz + actuator model</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(22.035459 59.662196)">IBVS + precision stop gates</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(14.835202 67.927196)">command lease (generation no.)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="208.08" y="28.883088" transform="rotate(-0 208.08 28.883088)">Sensor process</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(162.203906 43.132196)">spawned; own OpenGL + model</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(167.385117 51.397196)">renders copied state (30 Hz)</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(169.591195 59.990391)">ArUco / SIFT / Learned GPU</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(167.008383 67.927196)">work &gt; 50 ms old is dropped</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="354.7224" y="28.883682" transform="rotate(-0 354.7224 28.883682)">Receiver thread</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(313.425455 43.132196)">sole reader of the result pipe</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(310.845314 51.397196)">forwards whole messages only</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(311.525306 59.662196)">may block; control never does</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(316.300392 67.927196)">bounded 0.5 s join at close</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="61.4376" y="128.314117" transform="rotate(-0 61.4376 128.314117)">Command path</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.096225 142.562631)">zero on any trip (latched/held)</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(32.1966 150.827631)">caps 0.35 / 0.6 rad/s</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(18.371873 159.092631)">backstop 0.03 rad before limit</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(26.766459 167.357631)">accel / decel / jerk limits</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="208.08" y="128.314117" transform="rotate(-0 208.08 128.314117)">Supervision, every tick</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(158.677922 142.562631)">image age ≤ 400 ms (250 default)</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(167.382445 150.827631)">loop gap / compute ≤ 50 ms</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(165.549984 159.354029)">worker alive, clock monotonic</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(167.229703 167.357631)">clearance + joint-limit guard</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="354.7224" y="128.314117" transform="rotate(-0 354.7224 128.314117)">Mailbox + transport</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(324.93233 142.824029)">one item, latest wins</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(317.339306 150.827631)">never blocks the producer</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(325.706283 159.04231)">transport queue ≤ 8</text>
    <text style="font-size: 5.7px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(324.644213 167.357631)">optional added delay</text>
   </g>
